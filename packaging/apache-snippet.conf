# tylervigario-website Apache reverse-proxy snippet.
#
# Installed at /usr/share/tylervigario-website/apache-snippet.conf
# (RPM-owned, read-only). NOT in /etc/httpd/conf.d/ — Apache doesn't
# auto-load this. The operator includes it from inside their own
# <VirtualHost> block. Example /etc/httpd/conf.d/<vhost>.conf:
#
#   <VirtualHost *:80>
#       ServerName tylervigario.com
#       RewriteEngine on
#       RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [R=permanent,L]
#   </VirtualHost>
#
#   <VirtualHost *:443>
#       ServerName tylervigario.com
#       ServerAlias www.tylervigario.com
#
#       ErrorLog  /var/log/httpd/tylervigario.com-error.log
#       CustomLog /var/log/httpd/tylervigario.com-access.log combined
#
#       SSLEngine on
#       SSLCertificateFile    /etc/letsencrypt/live/tylervigario.com/fullchain.pem
#       SSLCertificateKeyFile /etc/letsencrypt/live/tylervigario.com/privkey.pem
#       Include /etc/letsencrypt/options-ssl-apache.conf
#
#       Include /usr/share/tylervigario-website/apache-snippet.conf
#   </VirtualHost>
#
# Domain name, TLS cert paths, log paths, and the www→apex redirect
# are all host-specific — the operator owns them. This snippet ships
# only the host-portable bits: security headers, static-asset cache
# headers, and the ProxyPass plumbing.

Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "SAMEORIGIN"
Header always set Referrer-Policy "strict-origin-when-cross-origin"
Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"

<LocationMatch "^/_next/static/">
    Header set Cache-Control "public, max-age=31536000, immutable"
</LocationMatch>

ProxyPreserveHost On
RequestHeader set X-Forwarded-Proto "https"
RequestHeader set X-Forwarded-For "%{REMOTE_ADDR}s"

ProxyRequests Off
ProxyPass / http://127.0.0.1:3000/
ProxyPassReverse / http://127.0.0.1:3000/
