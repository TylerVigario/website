# State directory — sqlite database lives here.
# StateDirectory= in the unit creates /var/lib/tylervigario-website, but
# tmpfiles.d ownership lines act as a backstop if the unit ever runs as
# root or with a different DynamicUser= setup later.
d /var/lib/tylervigario-website   0750 website website -
d /var/cache/tylervigario-website 0750 website website -
