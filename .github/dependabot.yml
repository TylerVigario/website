# Dependency updates. Until this existed, npm and action bumps only
# happened when someone went looking — on an app reachable from the
# internet that ships straight to the host serving it.
#
# Everything here lands as a PR, so it is gated by ci.yml like any other
# change; nothing auto-merges.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: sunday
    open-pull-requests-limit: 5
    commit-message:
      # The type is the release decision, so it follows the repo's rule:
      # did the artifact change. Runtime dependencies ship in the tarball,
      # so their bumps are `build` — which cliff.toml records under Build &
      # Packaging and releases as a patch. Development dependencies never
      # reach the tarball, so theirs are `chore` and release nothing.
      #
      # Every npm bump used to be `chore`, which cliff.toml skips. A
      # security fix to nodemailer or better-sqlite3 would merge, and
      # Release would then report "nothing bump-worthy" and ship nothing.
      prefix: build
      prefix-development: chore
      include: scope
    groups:
      # One PR per cluster rather than per package: an astro bump that
      # needs a matching adapter bump should be reviewed and gated
      # together, not as two PRs that are each red alone.
      #
      # This previously grouped next / @next/* / react, none of which
      # have existed since the Astro rebuild — so those groups matched
      # nothing, and the packages that do exist arrived one PR each.
      # Production only, so the group is wholly `build` or wholly `chore`
      # — never a mix whose prefix would depend on how Dependabot breaks
      # the tie. @astrojs/check, a dev tool, lands in dev-tooling.
      astro:
        dependency-type: production
        patterns:
          - astro
          - "@astrojs/*"
      dev-tooling:
        dependency-type: development
        patterns:
          - "*"
    ignore:
      # Held deliberately, and Dependabot re-raises both weekly without
      # this. Remove an entry when its blocker clears.
      #
      # Two independent blockers, both re-verified 2026-09-22:
      # typescript-eslint peers >=4.8.4 <6.1.0, and @astrojs/check —
      # which is what `npm run typecheck` runs — peers ^5.0.0 ||
      # ^6.0.0. TypeScript 7 has neither a lint path nor a typecheck
      # path yet, and typecheck is the load-bearing one.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # @types/node tracks the runtime, and .nvmrc plus engines.node both
      # pin Node 24. Types ahead of the runtime describe APIs that are
      # not there.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    # Both directories. "/" covers .github/workflows only — a composite
    # action under .github/actions is invisible to it, which is how the
    # setup action sat two majors behind while every workflow around it
    # got update PRs.
    directories:
      - /
      - /.github/actions/setup
    schedule:
      interval: weekly
      day: sunday
    open-pull-requests-limit: 5
    commit-message:
      # Workflow changes are CI infrastructure: `ci`, which never releases.
      prefix: ci
      include: scope
    groups:
      actions:
        patterns:
          - "*"
