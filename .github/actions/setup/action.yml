name: Setup CI environment
description: >-
  Install Node (the version .nvmrc names, checked by digest), cache npm,
  and run `npm ci`. The reusable block every job that runs npm scripts
  needs.

  Caller runs `actions/checkout` BEFORE invoking this composite: the
  cache key and `npm ci` read the repository's package files.

  Node-pin verification lives in its own job (ci.yml's "Node pins
  agree") — a repo-state check (.nvmrc, package.json#engines.node and
  the node action's digest file), so running it once is enough.

runs:
  using: composite
  steps:
    # .nvmrc IS the pin, read inside the action, so this composite takes
    # no node-version input to drift from the file.
    - uses: $/.github/actions/node

    - name: Compute npm cache key
      # Hash package.json's dep fields ONLY, not the full lockfile.
      # The release path rewrites package-lock.json's root `version`
      # on every run, so a key based on hashFiles('**/package-lock.json')
      # would rotate every release and accumulate one stale cache per
      # run. ~/.npm holds tarballs and metadata, nothing tied to a Node
      # version, so the key names none.
      id: cache-key
      shell: bash
      run: |
        HASH=$(jq -S '{dependencies,devDependencies,optionalDependencies,peerDependencies}' package.json | sha256sum | cut -c1-16)
        echo "key=npm-${{ runner.os }}-${HASH}" >> "$GITHUB_OUTPUT"

    - uses: actions/cache@v6.1.0
      with:
        path: ~/.npm
        key: ${{ steps.cache-key.outputs.key }}
        restore-keys: |
          npm-${{ runner.os }}-

    - name: Install, running no package's scripts
      # package.json#allowScripts reviews install scripts, but only an npm
      # that reads it enforces it, and the npm here is whichever one the
      # Node from .nvmrc bundles. --ignore-scripts makes CI independent of
      # that: no dependency runs code at install. The one approved script,
      # better-sqlite3's, compiles nothing where a prebuilt binary exists,
      # and the binary it would have found is the one the release ships
      # (make-release.ts installs with --ignore-scripts too), so the
      # tests load what production loads.
      shell: bash
      run: npm ci --prefer-offline --ignore-scripts
