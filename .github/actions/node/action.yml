name: Install Node
description: >-
  Install the Node that .nvmrc names, from nodejs.org, refused unless the
  archive's sha256 matches node-linux-x64.sha256 beside this file. That
  line is copied from the release's SHASUMS256.txt, which Node's
  releasers sign, once the signature verifies (CLAUDE.md says how).
  setup-node, which this replaces, downloaded a repackaged archive and
  checked only that `node --version` answered.

  Caller runs `actions/checkout` BEFORE invoking this composite: it
  reads .nvmrc.

runs:
  using: composite
  steps:
    - name: Download Node and check it by digest
      shell: bash
      run: |
        version=$(tr -d '[:space:]' < .nvmrc)
        file="node-v$version-linux-x64.tar.xz"
        sums="$GITHUB_ACTION_PATH/node-linux-x64.sha256"
        if ! grep -q "  $file\$" "$sums"; then
          echo "::error::node-linux-x64.sha256 holds no digest for $file: update it with .nvmrc"
          exit 1
        fi
        cd "$RUNNER_TEMP"
        curl -sSfL --retry 3 -o "$file" "https://nodejs.org/dist/v$version/$file"
        # Passes on the answer as well as the exit status.
        checked=$(sha256sum -c "$sums")
        if [ "$checked" != "$file: OK" ]; then
          echo "::error::$file does not match its digest: $checked"
          exit 1
        fi
        mkdir -p node
        tar -xJf "$file" -C node --strip-components=1
        rm "$file"
        echo "$RUNNER_TEMP/node/bin" >> "$GITHUB_PATH"

    - name: Confirm the Node on PATH is the one checked
      shell: bash
      run: |
        want="v$(tr -d '[:space:]' < .nvmrc)"
        have=$(node --version)
        where=$(command -v node)
        if [ "$have" != "$want" ] || [ "$where" != "$RUNNER_TEMP/node/bin/node" ]; then
          echo "::error::node on PATH is $have at $where, not $want at $RUNNER_TEMP/node/bin/node"
          exit 1
        fi
        echo "node $have, npm $(npm --version), from $where"
