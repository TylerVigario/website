name: CI

env:
  HUSKY: 0
  CI: true
  # Pinned to match prod's installed Node major. See package.json
  # `engines.node` and .nvmrc — all three must declare the same
  # major; the gate's "Verify Node major pins agree" step enforces it.
  # Node major. Five places have to declare it: this env var,
  # .nvmrc, package.json#engines.node, the spec's Requires: nodejs<N>,
  # and the unit's ExecStart=/usr/bin/node-<N>. The gate's "Verify
  # Node major pins agree" step enforces the first three; the spec
  # and unit have to be edited manually in lockstep when bumping.
  NODE_VERSION: "24"
  PKG_NAME: tylervigario-website

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump for release (leave empty to auto-detect from commits)"
        required: false
        type: choice
        options: ["", "major", "minor", "patch"]
        default: ""

# Concurrency: PRs cancel prior runs of the same PR (saves CI time
# on rapid pushes), main pushes and dispatch runs queue serially
# (don't cancel — every commit on main matters, every dispatch is a
# release attempt).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Default to read-only. The release job escalates per-job.
permissions:
  contents: read

jobs:
  # =========================================================================
  # Gate — quality checks + full-build validation. Runs on every PR, every
  # push to main, and at the start of every release attempt. Failure here
  # blocks a release attempt from ever invoking the rpmbuild path.
  # =========================================================================
  gate:
    name: Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6
      - name: Verify Node major pins agree
        # NODE_VERSION env (this workflow), .nvmrc, and package.json
        # engines.node must all declare the same Node major. The
        # production RPM's Requires also pins this major — drift here
        # would let CI green-light a build prod won't accept.
        run: |
          NVMRC_MAJOR=$(sed -E 's/^[^0-9]*([0-9]+).*/\1/' .nvmrc)
          ENGINES_MAJOR=$(node -p "require('./package.json').engines.node.match(/\d+/)[0]")
          ENV_VERSION="${{ env.NODE_VERSION }}"
          echo "Node major check: NODE_VERSION=$ENV_VERSION  .nvmrc=$NVMRC_MAJOR  engines.node=$ENGINES_MAJOR"
          if [ "$NVMRC_MAJOR" != "$ENV_VERSION" ] || [ "$ENGINES_MAJOR" != "$ENV_VERSION" ]; then
            echo "::error::Node major mismatch — bump NODE_VERSION env (release.yml), .nvmrc, and package.json engines.node together."
            exit 1
          fi
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      # Cache key derived from package.json's deps fields ONLY, not
      # the full lockfile. The release path rewrites
      # package-lock.json's root `version` on every run, so a key
      # based on `hashFiles('**/package-lock.json')` would rotate
      # every release and accumulate one stale cache per run.
      - name: Compute npm cache key
        id: cache-key
        run: |
          HASH=$(jq -S '{dependencies,devDependencies,optionalDependencies,peerDependencies}' package.json | sha256sum | cut -c1-16)
          echo "key=npm-${{ runner.os }}-node${{ env.NODE_VERSION }}-${HASH}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ steps.cache-key.outputs.key }}
          restore-keys: |
            npm-${{ runner.os }}-node${{ env.NODE_VERSION }}-
      - run: npm ci --prefer-offline
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format
      - run: npm test
      - name: Validate build
        # Under the RPM-as-artifact model, the gate's build is a sanity
        # check on ubuntu-latest — the load-bearing build happens later
        # inside a Fedora 43 container during release. If the gate's
        # ubuntu build fails, the Fedora rpmbuild won't pass either.
        # Cheaper to fail here.
        run: npm run build
        env:
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}

  # =========================================================================
  # Release — bumps version, generates changelog, tags, builds + signs the
  # RPM inside a Fedora 43 container (matches prod's glibc for
  # better-sqlite3), uploads to repo.tylervigario.com, attaches the signed
  # RPM to the GitHub Release.
  #
  # Runs on workflow_dispatch only. Production picks up the new RPM via
  # `sudo dnf upgrade tylervigario-website`, manually, when Tyler chooses.
  # =========================================================================
  release:
    name: Release
    needs: gate
    if: github.event_name == 'workflow_dispatch'
    # Self-hosted runner on the repo host itself (rpm-build, rpm-sign,
    # createrepo_c, gpg2 all preinstalled; github-runner user is in the
    # apache group with g+ws on /srv/dnf-repo). Drops the previous
    # Fedora-container + SSH-publish chain in favor of a local cp.
    runs-on: [self-hosted, fedora-43]
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install git-cliff
        run: |
          curl -sSL -o /tmp/git-cliff.tar.gz \
            https://github.com/orhun/git-cliff/releases/download/v2.6.1/git-cliff-2.6.1-x86_64-unknown-linux-gnu.tar.gz
          tar xzf /tmp/git-cliff.tar.gz -C /tmp
          # /usr/local/bin is system-owned and the runner user can't
          # write to it. Install under the runner's own .local/bin and
          # prepend to $GITHUB_PATH so subsequent steps see it.
          mkdir -p "$HOME/.local/bin"
          install -m 0755 /tmp/git-cliff-*/git-cliff "$HOME/.local/bin/git-cliff"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/git-cliff" --version

      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Determine next version
        id: version
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          if [ -n "${{ inputs.bump }}" ]; then
            TAG=$(git-cliff --bump ${{ inputs.bump }} --bumped-version)
          else
            TAG=$(git-cliff --bumped-version)
          fi
          BARE="${TAG#v}"
          if [ "$BARE" = "$CURRENT" ]; then
            echo "::warning::No version change detected (already at $CURRENT). Skipping release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$BARE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Next version: $TAG (current: $CURRENT)"

          if git rev-parse --verify "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists in git. A previous release run probably partially completed. Manually delete the tag (git push --delete origin $TAG) or bump past it before retrying."
            exit 1
          fi

      - name: Bump package.json
        if: steps.version.outputs.skip != 'true'
        run: npm version ${{ steps.version.outputs.version }} --no-git-tag-version

      - name: Generate changelog
        if: steps.version.outputs.skip != 'true'
        run: |
          BUMP_ARG="${{ inputs.bump }}"
          git-cliff --bump ${BUMP_ARG:+$BUMP_ARG} --output CHANGELOG.md
          git-cliff --bump ${BUMP_ARG:+$BUMP_ARG} --unreleased --strip header --output RELEASE_NOTES.md

      - name: Commit, tag and push
        if: steps.version.outputs.skip != 'true'
        run: |
          git add package.json package-lock.json CHANGELOG.md
          git commit -m "chore(release): ${{ steps.version.outputs.tag }}"
          # Annotated tag (-a) — required for `git push --follow-tags`
          # to actually push it. Lightweight tags are silently skipped
          # by --follow-tags, which leaves the commit on main and the
          # tag nowhere (and dnf would have nothing to point a rollback
          # at, since rollbacks index by git tag).
          git tag -a ${{ steps.version.outputs.tag }} -m "Release ${{ steps.version.outputs.tag }}"
          git push origin main --follow-tags

      # ---- RPM build ----
      - name: Prepare rpmbuild tree
        if: steps.version.outputs.skip != 'true'
        run: |
          mkdir -p $HOME/rpmbuild/{SOURCES,SPECS,BUILD,RPMS,SRPMS}
          VERSION="${{ steps.version.outputs.version }}"
          git archive --prefix="${PKG_NAME}-${VERSION}/" --format=tar.gz \
              -o $HOME/rpmbuild/SOURCES/${PKG_NAME}-${VERSION}.tar.gz HEAD

      - name: rpmbuild -ba
        if: steps.version.outputs.skip != 'true'
        env:
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
        run: |
          rpmbuild -ba \
            --define "_version ${{ steps.version.outputs.version }}" \
            --define "_topdir $HOME/rpmbuild" \
            packaging/${PKG_NAME}.spec

      - name: Locate built RPM
        id: rpm
        if: steps.version.outputs.skip != 'true'
        run: |
          # Match by exact version (not just package name). The
          # self-hosted runner's rpmbuild tree persists across runs,
          # so leftover RPMs from earlier builds sit alongside the
          # one we just produced. `find ... | head -1` was returning
          # whichever the kernel handed back first — frequently the
          # wrong (old) file — and downstream steps signed/published
          # that one. Match by ${PKG_NAME}-${VERSION}-* and assert
          # exactly one hit.
          VERSION="${{ steps.version.outputs.version }}"
          mapfile -t MATCHES < <(find "$HOME/rpmbuild/RPMS" -name "${PKG_NAME}-${VERSION}-*.rpm" -type f)
          if [ "${#MATCHES[@]}" -eq 0 ]; then
            echo "::error::no RPM produced for version ${VERSION}"
            exit 1
          fi
          if [ "${#MATCHES[@]}" -gt 1 ]; then
            echo "::error::multiple RPMs match ${PKG_NAME}-${VERSION}-*.rpm — ambiguous build state"
            printf '  %s\n' "${MATCHES[@]}"
            exit 1
          fi
          RPM="${MATCHES[0]}"
          echo "Built: $RPM"
          rpm -qpi "$RPM"
          echo "path=$RPM" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$RPM")" >> "$GITHUB_OUTPUT"

      # ---- Sign ----
      - name: Import GPG signing subkey
        if: steps.version.outputs.skip != 'true'
        env:
          GPG_SIGNING_SUBKEY: ${{ secrets.GPG_SIGNING_SUBKEY }}
        run: |
          # Subkey goes into the runner user's own gpg keyring (under
          # $HOME/.gnupg) — used by rpmsign --addsign in the next step.
          #
          # NOTE: previous workflow also did `rpm --import` here so the
          # system rpm keyring would trust the pubkey for `rpm -K`. That
          # step needs root (rpm writes to /usr/lib/sysimage/rpm). On
          # this self-hosted runner the host's rpm keyring ALREADY
          # trusts the master pubkey — it was imported when the existing
          # server-admin-* RPMs got signed and shipped from the same
          # /etc/server-admin/gnupg keyring. Verified via `rpm -K` on
          # an in-repo server-admin-base RPM returning "digests
          # signatures OK". No further import needed.
          echo "$GPG_SIGNING_SUBKEY" | base64 -d | gpg --batch --import
          gpg --list-secret-keys

      - name: Sign RPM
        if: steps.version.outputs.skip != 'true'
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_PASSPHRASE: ${{ secrets.GPG_SIGNING_PASSPHRASE }}
        run: |
          # Write the passphrase to a tempfile and use --passphrase-file
          # via %_gpg_sign_cmd_extra_args. Avoids re-defining the whole
          # %__gpg_sign_cmd macro (the previous attempt copied a stale
          # form with a duplicated `gpg` argv that confused the parser
          # into treating every flag as a filename). The default macro
          # on Fedora already does the right thing; we just need to
          # inject --batch + --pinentry-mode loopback + --passphrase-file.
          PASSFILE=$(mktemp)
          chmod 600 "$PASSFILE"
          trap 'rm -f "$PASSFILE"' EXIT
          printf '%s' "$GPG_PASSPHRASE" > "$PASSFILE"

          cat > $HOME/.rpmmacros <<EOF
          %_signature gpg
          %_gpg_name ${GPG_KEY_ID}
          %_gpg_sign_cmd_extra_args --batch --pinentry-mode loopback --passphrase-file ${PASSFILE}
          EOF
          rpmsign --addsign "${{ steps.rpm.outputs.path }}"
          rpm -K "${{ steps.rpm.outputs.path }}"

      # ---- Publish to /srv/dnf-repo (local) ----
      - name: Publish RPM to dnf repo
        if: steps.version.outputs.skip != 'true'
        run: |
          # Self-hosted runner: github-runner is in the apache group
          # and /srv/dnf-repo is g+ws apache, so the cp + createrepo_c
          # below run without sudo. restorecon picks up the dir's
          # default SELinux context (httpd_sys_content_t) for the new
          # file. cp -p preserves permissions from the source (root
          # 0644 from rpmbuild) which is fine for read-by-apache.
          cp -p "${{ steps.rpm.outputs.path }}" /srv/dnf-repo/
          restorecon -F "/srv/dnf-repo/${{ steps.rpm.outputs.name }}"
          createrepo_c --update --quiet /srv/dnf-repo
          echo "Published /srv/dnf-repo/${{ steps.rpm.outputs.name }}"

      # ---- GitHub Release ----
      - name: Create GitHub Release with RPM asset
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "${{ steps.rpm.outputs.path }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --notes-file RELEASE_NOTES.md

      - name: Generate job summary
        if: always()
        run: |
          VERSION=${{ steps.version.outputs.version }}
          TAG=${{ steps.version.outputs.tag }}
          SKIP=${{ steps.version.outputs.skip }}
          RPM=${{ steps.rpm.outputs.name }}
          {
            echo "## Release Summary"
            echo
            if [ "$SKIP" = "true" ]; then
              echo "> **Skipped** — no version change (already at v${VERSION})"
            else
              echo "| Item | Value |"
              echo "|------|-------|"
              echo "| **Version** | v${VERSION} |"
              echo "| **Tag** | \`${TAG}\` |"
              echo "| **Bump** | ${{ inputs.bump || 'auto-detected' }} |"
              echo "| **RPM** | \`${RPM}\` |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
