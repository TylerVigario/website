name: Release

# Releases are deliberate. This runs when the operator asks for it, not
# when a PR merges — merging says "the code is good", releasing says
# "ship it", and those are separate decisions made at separate times.
# The automation lives downstream: the host notices a new release and
# picks it up. Creating one stays human.
#
# What the operator does not decide is the number. git-cliff computes it
# from the commits since the last tag, using cliff.toml's commit_parsers:
# feat bumps minor; fix, revert, perf, refactor and build bump patch; ci,
# docs, test, chore and style never bump. A run with nothing bump-worthy
# exits without releasing. The operator may say how far to move instead
# (patch, minor or major), but never to which number: a level is always
# one step from the last release, so no version is skipped and none is
# reused, which a typed version could do either way.
#
# A DRY RUN rehearses all of it but the writes. It decides the version,
# previews the release notes in the run summary, runs the gate, and
# builds and runs the artifact; publish, the only job that writes, does
# not run. Writing nothing, it may run from a branch, which is how a
# change to this workflow is tried before it merges.
#
# WHY THIS WRITES TO main. A tag has to point at a commit carrying the
# matching version and changelog. A tag on a commit whose package.json
# says something else makes "what is this artifact" unanswerable — the
# state v1.10.0 and v1.10.1 had to be repaired out of, one of them by
# matching an installed manifest against every commit in the repo.
# Producing such a commit means writing to main, and main refuses direct
# pushes, so the release App is a bypass actor on main-protection for
# that reason and no other. Its permissions are the blast radius: keep
# them at contents:write on this repository, with no workflows scope.
#
# THE RECORD FOLLOWS THE FACT. The release commit is made on a branch of
# its own, release/vX.Y.Z, cut from the commit being released. The
# release is published at that commit, which is what creates the tag,
# and only then is main fast-forwarded to it. Publishing is the step
# that cannot be taken back, so main never claims a version before the
# release exists: a failure up to publishing leaves main as it was. A
# failure after it leaves the release published and main one commit
# behind it, and dispatching again with auto finishes the release by
# moving main — to the commit publish made, which decide checks is that,
# and never to whatever a tag happens to name.
#
# THE APP TOKEN NEVER TOUCHES DISK. Checkouts here persist no
# credentials: nothing in this workflow runs git against the remote — the
# release commit is created by the forge over GraphQL, and gh reads its
# token from the environment of the two steps that write. A checkout with
# the App token and the default persist-credentials wrote it into
# .git/config for the whole job, readable by every dependency `npm ci` and
# the build executed, and that token is past main's protection.
#
# BUILDING AND PUBLISHING ARE SEPARATE JOBS, on separate machines. `build`
# runs every dependency the tree has: npm ci, Astro, the bundler. It holds
# no secret and cannot request an OIDC token. `publish` holds both, and
# runs nothing from node_modules. In one job, minting the App token after
# the build kept the token out of the build's reach only while the build
# left nothing behind, and nothing stops a step from leaving a process
# running, or rewriting PATH or the environment for the steps after it;
# the OIDC request token, which signs attestations, was in every step's
# environment from the start. A separate job starts on a clean runner,
# so what the build ran is not there.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "The step from the last release: auto lets the commits decide; patch, minor or major overrides them"
        type: choice
        options: [auto, patch, minor, major]
        default: auto
        required: true
      dry-run:
        description: "Decide the version, preview the changelog and run the gate; write nothing"
        type: boolean
        default: false
        required: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Deciding and doing are separate jobs so "nothing to release" is a
  # skipped job rather than a condition repeated on every step.
  #
  # It was repeated on every step but two, and the two it was missing
  # from were the commit and the tag — so a dispatch with nothing
  # bump-worthy would have written `chore(release):  [skip ci]` to main
  # with an empty version and then tried to tag it. A guard that must be
  # remembered per step is a guard that eventually is not.
  decide:
    # From main only, unless it is a dry run. The release environment
    # refuses any other ref too, but only at publish, after a gate and a
    # build that a branch would have run for nothing. A dry run never
    # reaches publish, so on a branch those are the point of it.
    if: github.ref == 'refs/heads/main' || inputs.dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release: ${{ steps.decide.outputs.release }}
      finish: ${{ steps.decide.outputs.finish }}
      version: ${{ steps.decide.outputs.version }}
      tag: ${{ steps.decide.outputs.tag }}
      oid: ${{ steps.decide.outputs.oid }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # git-cliff walks back to the previous tag. A shallow clone
          # computes the wrong version silently rather than failing. Full
          # history also brings every tag, which the check below reads.
          fetch-depth: 0
          persist-credentials: false

      # git-cliff comes from the lockfile, like every other tool here:
      # pinned by version and verified by its sha512 on install, and
      # raised by Dependabot when it moves. The action it replaces pinned
      # its own commit but downloaded the binary by tag name with no
      # checksum, from a release that can be edited.
      - uses: ./.github/actions/setup

      - name: Decide
        id: decide
        # The input arrives through env, never interpolated into the
        # script. `${{ }}` pastes the value in as source text before bash
        # sees it. The form offers four choices, but a dispatch through the
        # API can send any string, so the choice is checked here too.
        #
        # The tag decided here is validated here, at the one place it is
        # made. Every later step receives it through env and quotes it, but
        # a malformed tag is refused before any of them runs rather than
        # trusted to each: it is text another program produced. Nothing
        # mechanical checks this for us — CodeQL's workflow queries do not
        # treat dispatch inputs as untrusted — which is why it is a refusal
        # in code rather than a rule in a comment.
        env:
          BUMP: ${{ inputs.bump }}
          GH_TOKEN: ${{ github.token }}
          # The release App's account, as GitHub names the author of the
          # commit publish asks it to construct.
          RELEASE_BOT: website-release[bot]
        run: |
          set -euo pipefail
          case "$BUMP" in
            auto | patch | minor | major) ;;
            *)
              printf '::error::Not a bump (expected auto, patch, minor or major): %q\n' "$BUMP"
              exit 1
              ;;
          esac

          last=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          current="v$(node -p "require('./package.json').version")"

          # A release that published and then failed to move main leaves its
          # tag on the release commit, one ahead of main. It is finished
          # first, by moving main to it, or the next release would be cut
          # from a main without it. A level is refused rather than quietly
          # ignored: it asks for a release past the unfinished one.
          if [ -n "$last" ] && ! git merge-base --is-ancestor "$last" HEAD; then
            if ! [[ "$last" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              printf '::error::Not a version (expected vMAJOR.MINOR.PATCH): %q\n' "$last"
              exit 1
            fi
            if [ "$(git rev-parse "$last^")" != "$(git rev-parse HEAD)" ]; then
              echo "::error::$last is published, but main has moved on without it, so main cannot be fast-forwarded to it."
              exit 1
            fi
            if [ "$BUMP" != auto ]; then
              echo "::error::$last is published and main has not moved to it. Run with auto to finish $last first; a $BUMP bump now would release past it."
              exit 1
            fi

            # The tag is not the evidence. Finishing moves main through the
            # App's bypass, past the pull request, the checks and code
            # scanning, so the commit it moves main to must be the one
            # publish made, and its release must be published. Anything
            # that can write contents can push a tag; only the App can have
            # GitHub construct and sign a commit as the App.
            oid=$(git rev-parse "$last^{commit}")
            # A draft has no tag yet, so this answers 404 for one too.
            if ! rel=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$last" \
              --jq '[(.draft | tostring), .author.login] | join(" ")' 2>"$RUNNER_TEMP/release.err"); then
              echo "::error::$last has no published release, so there is nothing to finish: $(tr '\n' ' ' < "$RUNNER_TEMP/release.err")"
              exit 1
            fi
            if [ "$rel" != "false $RELEASE_BOT" ]; then
              echo "::error::$last's release is not one publish made: draft and author are \"$rel\", expected \"false $RELEASE_BOT\"."
              exit 1
            fi
            if ! commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/$oid" \
              --jq '[.author.login // "", (.commit.verification.verified | tostring), .commit.verification.reason] | join(" ")' 2>"$RUNNER_TEMP/commit.err"); then
              echo "::error::$last names $oid, which GitHub does not have: $(tr '\n' ' ' < "$RUNNER_TEMP/commit.err")"
              exit 1
            fi
            if [ "$commit" != "$RELEASE_BOT true valid" ]; then
              echo "::error::$last names $oid, which is not a release commit: author, signed and reason are \"$commit\", expected \"$RELEASE_BOT true valid\"."
              exit 1
            fi
            files=$(git diff --name-only "$oid^" "$oid" | sort | paste -sd ' ')
            if [ "$files" != "CHANGELOG.md package-lock.json package.json" ]; then
              echo "::error::$last's commit changes $files; a release commit changes CHANGELOG.md, package-lock.json and package.json, and nothing else."
              exit 1
            fi
            # Both manifests as publish leaves them: the version set to the
            # tag's, and every other byte as the commit before it had them.
            # Sorted and compacted, so the comparison is of content.
            for f in package.json package-lock.json; do
              strip='del(.version) | if .packages then del(.packages[""].version) else . end'
              versions='[.version, (.packages[""].version // empty)] | unique | join(" ")'
              if [ "$(git show "$oid:$f" | jq -cS "$strip")" != "$(git show "$oid^:$f" | jq -cS "$strip")" ]; then
                echo "::error::$last's commit changes $f beyond its version."
                exit 1
              fi
              if [ "$(git show "$oid:$f" | jq -r "$versions")" != "${last#v}" ]; then
                echo "::error::$last's commit sets $f to version $(git show "$oid:$f" | jq -r "$versions"), not ${last#v}."
                exit 1
              fi
            done
            {
              echo "release=false"
              echo "finish=true"
              echo "tag=$last"
              echo "oid=$oid"
            } >> "$GITHUB_OUTPUT"
            echo "Finishing $last: it is published, and main has not moved to it."
            exit 0
          fi
          # Only the check above reads the API. git-cliff, below, is a
          # dependency, and gets no token.
          unset GH_TOKEN

          # A level moves a release the commits make; it cannot make one.
          # With nothing bump-worthy since the last tag, git-cliff returns
          # that tag for every choice, because ci, docs, test, chore and
          # style commits never change the artifact.
          if [ "$BUMP" = auto ]; then
            next=$(npx --no-install git-cliff --config cliff.toml --bumped-version)
          else
            next=$(npx --no-install git-cliff --config cliff.toml --bumped-version --bump "$BUMP")
          fi
          if [ -z "$next" ] || [ "$next" = "$last" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "Nothing bump-worthy since $last. No release."
            exit 0
          fi

          if ! [[ "$next" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            # %q, not the raw value. A newline in it would otherwise start
            # a line of its own, and a line beginning `::` is a workflow
            # command.
            printf '::error::Not a version (expected vMAJOR.MINOR.PATCH): %q\n' "$next"
            exit 1
          fi
          echo "last=$last  main=$current  bump=$BUMP  next=$next"

          # A version is released once. The tag ruleset makes tags
          # permanent, so a second release of one could never produce its
          # tag. Nothing above can choose a tagged version, and this says
          # so in code: checked before anything runs, from the tags the
          # full-history checkout brought down.
          if git rev-parse -q --verify "refs/tags/$next" >/dev/null; then
            echo "::error::$next is already released: the tag exists, and tags are permanent."
            exit 1
          fi
          {
            echo "release=true"
            echo "version=${next#v}"
            echo "tag=$next"
          } >> "$GITHUB_OUTPUT"

      - name: Preview the release notes
        # In the run summary, which is what a dry run is read from. The
        # published notes are rendered again in build, from the same
        # commit by the same git-cliff and cliff.toml.
        if: steps.decide.outputs.release == 'true'
        env:
          TAG: ${{ steps.decide.outputs.tag }}
        run: |
          set -euo pipefail
          {
            echo "## $TAG"
            echo
            npx --no-install git-cliff --config cliff.toml --tag "$TAG" --unreleased --strip all
          } >> "$GITHUB_STEP_SUMMARY"

  # THE gate, not a copy of it. ci.yml is callable for exactly this: the
  # checks every pull request passes — pins, install scripts, typecheck,
  # lint with actionlint, format, tests, build, the bundle checks, the
  # forms without JavaScript, the release artifact, the dev server — run
  # here against the commit being released. `npm run ci` is not that
  # gate: it skips the pins, the release artifact and the dev server,
  # and reports shellcheck SKIPPED wherever nothing installed it.
  gate:
    needs: decide
    if: needs.decide.outputs.release == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  build:
    needs: [decide, gate]
    if: needs.decide.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Read-only, no environment, no id-token: this is the job that runs
    # the dependency tree, so it is the job that holds nothing.
    permissions:
      contents: read
    outputs:
      sha256: ${{ steps.digest.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The changelog is generated from the whole history.
          fetch-depth: 0
          persist-credentials: false

      # The same composite the gate uses: node from .nvmrc, an npm cache
      # keyed on the dependency set, and `npm ci`. One definition, so a
      # release builds on the toolchain the gate proved.
      - uses: ./.github/actions/setup

      - name: Regenerate the changelog, and render the release notes
        # Into a directory outside the tree. The build below refuses a
        # dirty tree, and that guard is worth more than the convenience
        # of writing here — it is what stops an artifact carrying changes
        # no commit records. The changelog is handed to the build as an
        # argument and to the publish job beside the tarball, so it
        # reaches both the artifact and the branch without the tree being
        # dirty in between.
        #
        # Both from one git-cliff, over one commit range, in one step, so
        # the notes shown on the release and the section added to
        # CHANGELOG.md cannot describe different sets of commits. Notes use
        # --unreleased rather than --latest: the tag does not exist yet,
        # so there is no latest to describe.
        env:
          TAG: ${{ needs.decide.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release"
          npx --no-install git-cliff --config cliff.toml --tag "$TAG" \
            --output "$RUNNER_TEMP/release/CHANGELOG.md"
          npx --no-install git-cliff --config cliff.toml --tag "$TAG" --unreleased --strip all \
            --output "$RUNNER_TEMP/release/NOTES.md"

      - name: Build the artifact
        # Everything up to publish is reversible: a failure leaves no
        # commit, no tag and no release, and a re-dispatch starts from an
        # unchanged main.
        #
        # The version is passed in rather than read from the tree. The
        # artifact's package.json is generated, so the bump does not need
        # to exist on disk for the tarball to carry the right number —
        # which is what lets every write happen after this point instead
        # of before it.
        env:
          VERSION: ${{ needs.decide.outputs.version }}
        run: >-
          npm run release -- --version "$VERSION"
          --changelog "$RUNNER_TEMP/release/CHANGELOG.md" --out "$RUNNER_TEMP/release"

      - name: The artifact runs
        # Unpacked the way the host unpacks it, checked against its own
        # manifest, then booted from its own node_modules and posted to.
        # Before this, the first time a tarball ever ran was on the host,
        # after it had been signed and its tag made permanent.
        env:
          VERSION: ${{ needs.decide.outputs.version }}
        run: npm run check:release -- "$RUNNER_TEMP/release/vigario-website-$VERSION.tar.gz"

      - name: Record the artifact's digest
        # The publish job attests what it downloads, and checks first that
        # it is byte-for-byte what was built and checked here.
        id: digest
        env:
          VERSION: ${{ needs.decide.outputs.version }}
        run: |
          set -euo pipefail
          sha=$(sha256sum "$RUNNER_TEMP/release/vigario-website-$VERSION.tar.gz" | cut -d' ' -f1)
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "vigario-website-$VERSION.tar.gz sha256 $sha"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            ${{ runner.temp }}/release/vigario-website-${{ needs.decide.outputs.version }}.tar.gz
            ${{ runner.temp }}/release/CHANGELOG.md
            ${{ runner.temp }}/release/NOTES.md
          if-no-files-found: error
          # Long enough to re-run a failed publish; the release itself is
          # what keeps the tarball.
          retention-days: 7

  publish:
    needs: [decide, build]
    # Every write the run makes is in this job, so a dry run ends before it.
    if: needs.decide.outputs.release == 'true' && !inputs.dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The environment holds the App's secrets and admits main alone, so a
    # job on any other ref is refused before a secret is in reach.
    environment: release
    permissions:
      contents: read
      # Both required by actions/attest: the OIDC token is the
      # keyless signing identity, and attestations:write stores the
      # result. There is no signing key to store, rotate, or leak.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Only the commit being released: this job reads package.json,
          # package-lock.json and HEAD, and walks no history.
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release

      - name: Check it is what was built
        # download-artifact checks the upload's own digest. This checks
        # the tarball inside it against the digest the build job took
        # after the artifact ran, so what is signed below is what was
        # checked, not merely what arrived.
        env:
          WANT: ${{ needs.build.outputs.sha256 }}
          VERSION: ${{ needs.decide.outputs.version }}
        run: |
          set -euo pipefail
          got=$(sha256sum "$RUNNER_TEMP/release/vigario-website-$VERSION.tar.gz" | cut -d' ' -f1)
          [ "$got" = "$WANT" ] || { echo "::error::tarball is $got, the build produced $WANT"; exit 1; }
          echo "sha256 $got, as built"

      - name: Attest the artifact
        # Binds the tarball's sha256 to this workflow, repo and commit
        # through Sigstore. A host verifies with `gh attestation verify`
        # before installing, which is the gate against a release asset
        # that did not come from here.
        #
        # actions/attest directly. attest-build-provenance became a wrapper
        # around it in v4, and GitHub points new workflows here. Given only
        # a subject it writes the same SLSA build provenance, signed by the
        # same workflow identity, so `gh attestation verify` sees no
        # difference.
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          # One artifact, one attestation. MANIFEST.sha256 lives inside
          # the tarball, so this signature already covers it; a copy
          # published beside it would add no proof and one more thing
          # that could disagree.
          subject-path: ${{ runner.temp }}/release/vigario-website-${{ needs.decide.outputs.version }}.tar.gz

      - name: Keep the attestation beside the artifact
        # The bundle the attest step wrote goes into the release next to the
        # tarball, named as Sigstore names one: <file>.sigstore.json. The
        # copy GitHub keeps can be deleted, and every check that fetches it
        # then fails. This one is frozen with the release and verifies with
        # no network at all: `gh attestation verify --bundle`.
        #
        # It has to be this tarball's, which is checked here, before the
        # first write: the statement inside names exactly one subject, and
        # its digest is the one the build job took.
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          WANT: ${{ needs.build.outputs.sha256 }}
          ARTIFACT: ${{ runner.temp }}/release/vigario-website-${{ needs.decide.outputs.version }}.tar.gz
        run: |
          set -euo pipefail
          got=$(jq -r '.dsseEnvelope.payload' "$BUNDLE" | base64 -d | jq -r '.subject[].digest.sha256')
          [ "$got" = "$WANT" ] || { echo "::error::the bundle names \"$got\", the tarball is $WANT"; exit 1; }
          cp "$BUNDLE" "$ARTIFACT.sigstore.json"
          echo "bundle for sha256 $got"

      - name: Mint a token for the release App
        # Only now, immediately before the first write, and only into the
        # environment of the three steps that use it. Scoped below what the
        # App is granted: contents:write is all the commit and the release
        # need, so the token carries nothing else even if the App is ever
        # given more.
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Write the release commit on a branch of its own
        id: commit
        # THE FIRST WRITE OF THE RUN. The artifact is built, run and
        # attested by now, so everything that could fail has.
        #
        # On release/vX.Y.Z, cut from the commit being released, not on
        # main. Nothing on the branch is final: main moves to it only once
        # the release is published, below.
        #
        # NOT `git commit && git push`. A push sends an object already
        # built, so it arrives unsigned no matter which token carried it.
        # createCommitOnBranch has GitHub construct the object and sign
        # it with its own key.
        #
        # expectedHeadOid makes it a compare-and-swap on that branch, which
        # this step has just cut and nothing else writes.
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ needs.decide.outputs.tag }}
          VERSION: ${{ needs.decide.outputs.version }}
        run: |
          set -euo pipefail
          # The bump lands in the tree only now, purely to be read into
          # the mutation below. Node, not `npm version`: this job runs
          # nothing from the package manager, and both files round-trip
          # byte-identically through JSON.stringify(…, null, 2), which is
          # what npm writes. Setting the number a branch already carries
          # is allowed, so a retry of a partial release is not refused.
          node -e '
            const fs = require("fs");
            const v = process.env.VERSION;
            const write = (f, edit) => {
              const o = JSON.parse(fs.readFileSync(f, "utf8"));
              edit(o);
              fs.writeFileSync(f, JSON.stringify(o, null, 2) + "\n");
            };
            write("package.json", (o) => { o.version = v; });
            write("package-lock.json", (o) => { o.version = v; o.packages[""].version = v; });
          '
          cp "$RUNNER_TEMP/release/CHANGELOG.md" CHANGELOG.md
          head=$(git rev-parse HEAD)
          branch="release/$TAG"
          # A failed run can leave its branch behind. Nothing on it was
          # published, since a published tag sends the next run to finish
          # instead, so it is cut again from this run's commit.
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch" >/dev/null 2>&1 || true
          gh api "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/heads/$branch" -f sha="$head" >/dev/null
          # --rawfile, not --arg "$(base64 ...)". A single argv entry is
          # capped at 128 KB on Linux and package-lock.json base64s to
          # roughly 460 KB, which failed as "jq: Argument list too long"
          # on the first real release. jq reads the files itself and
          # encodes them below, so nothing large crosses the command line.
          jq -n \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg head "$head" \
            --arg branch "$branch" \
            --arg msg "chore(release): $TAG [skip ci]" \
            --rawfile pkg package.json \
            --rawfile lock package-lock.json \
            --rawfile log CHANGELOG.md \
            '{query:"mutation($input:CreateCommitOnBranchInput!){createCommitOnBranch(input:$input){commit{oid}}}",
              variables:{input:{
                branch:{repositoryNameWithOwner:$repo,branchName:$branch},
                expectedHeadOid:$head,
                message:{headline:$msg},
                fileChanges:{additions:[
                  {path:"package.json",contents:($pkg|@base64)},
                  {path:"package-lock.json",contents:($lock|@base64)},
                  {path:"CHANGELOG.md",contents:($log|@base64)}]}}}}' > "$RUNNER_TEMP/mutation.json"
          oid=$(gh api graphql --input "$RUNNER_TEMP/mutation.json" --jq '.data.createCommitOnBranch.commit.oid')
          [ -n "$oid" ] || { echo "::error::createCommitOnBranch returned no oid"; exit 1; }
          echo "release commit: $oid, on $branch"
          {
            echo "oid=$oid"
            echo "head=$head"
            echo "branch=$branch"
          } >> "$GITHUB_OUTPUT"

      - name: Publish
        # DRAFT, ATTACH, THEN PUBLISH — in that order, and not as one call.
        #
        # Immutable releases freeze a release's assets at PUBLICATION.
        # `gh release create` with the file attaches it after the release
        # already exists, so publishing first would freeze an empty
        # release and refuse the upload that follows.
        #
        # A draft creates no tag. That is the second reason for this
        # order: until the draft is published, this run has produced no
        # tag at all, so a failure during upload leaves a deletable draft
        # rather than a permanent tag naming a release with nothing in it
        # — and the tag ruleset makes such a tag unremovable. Verified:
        # creating a draft left zero tags on the remote, and deleting it
        # left zero behind.
        #
        # Publishing is what creates the tag, at --target. It is a
        # lightweight tag, which costs nothing: what stops a tag moving is
        # the tag ruleset, which refuses to update an existing tag of
        # either kind.
        #
        # Immediately before publishing, main must still be the commit the
        # release branch was cut from. If anything merged since, main could
        # not be fast-forwarded to the release, and a published tag main
        # cannot reach could not be repaired: tags do not move and main
        # takes no force-push. So it is refused, nothing is published, and
        # the next dispatch cuts its branch from the new main.
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ needs.decide.outputs.tag }}
          OID: ${{ steps.commit.outputs.oid }}
          HEAD_OID: ${{ steps.commit.outputs.head }}
          BRANCH: ${{ steps.commit.outputs.branch }}
          ARTIFACT: ${{ runner.temp }}/release/vigario-website-${{ needs.decide.outputs.version }}.tar.gz
        run: |
          set -euo pipefail
          # A draft from a failed attempt names the commit that attempt
          # made; this run made another.
          if gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null | grep -qx true; then
            gh release delete "$TAG" --yes
          fi
          gh release create "$TAG" --draft --target "$OID" --title "$TAG" \
            --notes-file "$RUNNER_TEMP/release/NOTES.md"
          gh release upload "$TAG" "$ARTIFACT" "$ARTIFACT.sigstore.json"

          # The draft holds those two files and nothing else, byte for byte.
          # Once it is published nothing can be added, replaced or removed,
          # so a release missing its attestation would stay that way.
          want=$(for f in "$ARTIFACT" "$ARTIFACT.sigstore.json"; do
            echo "$(basename "$f") sha256:$(sha256sum "$f" | cut -d' ' -f1)"
          done | sort)
          got=$(gh release view "$TAG" --json assets --jq '.assets[] | "\(.name) \(.digest)"' | sort)
          if [ "$got" != "$want" ]; then
            echo "::error::the draft holds [$got], expected [$want]. Nothing is published; dispatch again."
            gh release delete "$TAG" --yes
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCH" >/dev/null || true
            exit 1
          fi

          now=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$now" != "$HEAD_OID" ]; then
            echo "::error::main moved to $now after $BRANCH was cut from $HEAD_OID. Nothing is published; dispatch again."
            gh release delete "$TAG" --yes
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCH" >/dev/null || true
            exit 1
          fi

          # Only now does the tag exist and the freeze fall.
          gh release edit "$TAG" --draft=false

          published=$(gh release view "$TAG" --json isDraft,assets \
            --jq 'if .isDraft then "draft" else ([.assets[].name]|join(",")) end')
          [ "$published" != "draft" ] || { echo "::error::$TAG is still a draft"; exit 1; }
          echo "published $TAG -> $OID with $published"

      - name: Move main to the release
        # The record, after the fact. force=false makes this a fast-forward
        # or nothing: main can gain the release commit and cannot lose a
        # commit to it. The App is main's one bypass actor, which is what
        # lets it write main at all.
        #
        # Retried, because a failure here leaves the release published and
        # main one commit behind it. If it still fails, dispatching again
        # with auto finishes the release with this same move.
        #
        # Unless main moved. Publish checks main a moment before the tag
        # exists, so only a merge in those few seconds gets here, and then
        # no fast-forward can ever reach the tag: retrying cannot help and
        # dispatching again is refused. Merging waits for a release to end.
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ needs.decide.outputs.tag }}
          OID: ${{ steps.commit.outputs.oid }}
          HEAD_OID: ${{ steps.commit.outputs.head }}
          BRANCH: ${{ steps.commit.outputs.branch }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/main" \
              -f sha="$OID" -F force=false >/dev/null; then
              echo "main -> $OID ($TAG)"
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCH" >/dev/null \
                || echo "::warning::$BRANCH was not deleted"
              exit 0
            fi
            now=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha || true)
            if [ -n "$now" ] && [ "$now" != "$HEAD_OID" ]; then
              echo "::error::$TAG is published at $OID, but main moved to $now while it published, so main cannot be fast-forwarded to it. $BRANCH is kept."
              exit 1
            fi
            sleep $((attempt * 5))
          done
          echo "::error::$TAG is published, but main did not move to it. Dispatch again with auto to finish."
          exit 1

  # A release that published and then failed to move main is finished
  # here, by the move publish ends with, and by nothing else: its
  # artifact, its attestation and its tag already exist.
  finish:
    needs: decide
    if: needs.decide.outputs.finish == 'true' && !inputs.dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: release
    permissions:
      contents: read
    steps:
      - name: Mint a token for the release App
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Move main to the release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ needs.decide.outputs.tag }}
          OID: ${{ needs.decide.outputs.oid }}
        run: |
          set -euo pipefail
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/main" \
            -f sha="$OID" -F force=false >/dev/null
          echo "main -> $OID ($TAG)"
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/release/$TAG" >/dev/null 2>&1 \
            || true
