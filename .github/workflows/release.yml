name: Release

# Releases are deliberate. This runs when the operator asks for it, not
# when a PR merges — merging says "the code is good", releasing says
# "ship it", and those are separate decisions made at separate times.
# The automation lives downstream: the host notices a new release and
# picks it up. Creating one stays human.
#
# What the operator does not decide is the number. git-cliff computes it
# from the commits since the last tag, so feat/fix/revert set the bump
# and a run with nothing bump-worthy exits without releasing.
#
# WHY THIS PUSHES TO main. A tag has to point at a commit carrying the
# matching version and changelog. A tag on a commit whose package.json
# says something else makes "what is this artifact" unanswerable, which
# is the state v1.10.0 and v1.10.1 had to be repaired out of — one of
# them by matching an installed manifest against every commit in the
# repo. Producing such a commit means writing to main, and main refuses
# direct pushes, so the release App is a bypass actor on
# main-protection for that reason and no other. Its permissions are the
# blast radius: keep them at contents:write on this repository.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Override the computed version (rarely needed; blank lets the commits decide)"
        required: false
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Both required by attest-build-provenance: the OIDC token is the
      # keyless signing identity, and attestations:write stores the
      # result. This is what replaces the RPM's GPG key — there is no
      # key on any host to store, rotate, or leak.
      id-token: write
      attestations: write
    steps:
      - name: Mint a token for the release App
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v5
        with:
          # git-cliff walks back to the previous tag. A shallow clone
          # computes the wrong version silently rather than failing.
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Work out whether there is anything to release
        id: bump
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --bumped-version
        env:
          OUTPUT: /tmp/next-version

      - name: Decide
        id: decide
        run: |
          set -euo pipefail
          current="v$(node -p "require('./package.json').version")"
          next="${{ inputs.version && format('v{0}', inputs.version) || steps.bump.outputs.content }}"
          echo "current=$current  next=$next"
          if [ -z "$next" ] || [ "$next" = "$current" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "Nothing bump-worthy since $current. No release."
          else
            {
              echo "release=true"
              echo "version=${next#v}"
              echo "tag=$next"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Regenerate the changelog
        if: steps.decide.outputs.release == 'true'
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --tag ${{ steps.decide.outputs.tag }}
        env:
          OUTPUT: CHANGELOG.md

      - name: Write the version into the manifests
        if: steps.decide.outputs.release == 'true'
        run: npm version "${{ steps.decide.outputs.version }}" --no-git-tag-version

      - name: Install dependencies
        if: steps.decide.outputs.release == 'true'
        run: npm ci

      - name: Gate the release commit
        # The same gate every PR runs. A release is still a commit on
        # main and does not get to skip it — and this is what makes
        # "build failures are a CD concern" true rather than aspirational:
        # a broken tree never becomes a published artifact.
        if: steps.decide.outputs.release == 'true'
        run: npm run ci

      - name: Ask the forge to write the release commit
        id: commit
        # NOT `git commit && git push`. A push sends an object already built,
        # so it arrives unsigned no matter which token carried it — that is
        # why every chore(release) commit in this repository's history is
        # unsigned. createCommitOnBranch has GitHub construct the object and
        # sign it with its own key, which costs nothing and is the only way a
        # release commit satisfies the signing rule.
        #
        # expectedHeadOid makes it a compare-and-swap: if anything landed on
        # main since this job read it, the mutation fails rather than
        # clobbering.
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ steps.decide.outputs.tag }}
        run: |
          set -euo pipefail
          head=$(git rev-parse HEAD)
          jq -n \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg head "$head" \
            --arg msg "chore(release): $TAG [skip ci]" \
            --arg pkg "$(base64 -w0 package.json)" \
            --arg lock "$(base64 -w0 package-lock.json)" \
            --arg log "$(base64 -w0 CHANGELOG.md)" \
            '{query:"mutation($input:CreateCommitOnBranchInput!){createCommitOnBranch(input:$input){commit{oid}}}",
              variables:{input:{
                branch:{repositoryNameWithOwner:$repo,branchName:"main"},
                expectedHeadOid:$head,
                message:{headline:$msg},
                fileChanges:{additions:[
                  {path:"package.json",contents:$pkg},
                  {path:"package-lock.json",contents:$lock},
                  {path:"CHANGELOG.md",contents:$log}]}}}}' > /tmp/mutation.json
          oid=$(gh api graphql --input /tmp/mutation.json --jq '.data.createCommitOnBranch.commit.oid')
          [ -n "$oid" ] || { echo "::error::createCommitOnBranch returned no oid"; exit 1; }
          echo "release commit: $oid"
          echo "oid=$oid" >> "$GITHUB_OUTPUT"

      - name: Tag it
        # After the commit exists, never before. Publication is the step that
        # cannot be taken back; a tag announcing a release that failed to
        # publish leaves the repository asserting something untrue.
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ steps.decide.outputs.tag }}
          OID: ${{ steps.commit.outputs.oid }}
        run: |
          set -euo pipefail
          obj=$(gh api "repos/$GITHUB_REPOSITORY/git/tags" \
            -f tag="$TAG" -f message="Release $TAG" -f object="$OID" -f type=commit \
            --jq .sha)
          gh api "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$TAG" -f sha="$obj" >/dev/null
          echo "tagged $TAG -> $OID"

      - name: Build the artifact
        if: steps.decide.outputs.release == 'true'
        run: npm run release

      - name: Attest the artifact
        # Binds the tarball's sha256 to this workflow, this repo and this
        # commit, signed through Sigstore. The host verifies with
        # `gh attestation verify` before it installs anything, which is
        # the local gate against a release asset that did not come from
        # here.
        if: steps.decide.outputs.release == 'true'
        uses: actions/attest-build-provenance@v3
        with:
          # One artifact, one attestation. MANIFEST.sha256 lives inside
          # the tarball, so this signature already covers it — publishing
          # a second copy beside it would add no proof and one more thing
          # that could disagree.
          subject-path: dist-release/vigario-website-${{ steps.decide.outputs.version }}.tar.gz

      - name: Publish
        if: steps.decide.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ steps.decide.outputs.tag }}
          VERSION: ${{ steps.decide.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            "dist-release/vigario-website-${VERSION}.tar.gz" \
            --title "$TAG" \
            --notes "$(npx --yes git-cliff@2 --config cliff.toml --latest --strip all)"
