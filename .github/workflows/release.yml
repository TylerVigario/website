name: Release

# Releases are deliberate. This runs when the operator asks for it, not
# when a PR merges — merging says "the code is good", releasing says
# "ship it", and those are separate decisions made at separate times.
# The automation lives downstream: the host notices a new release and
# picks it up. Creating one stays human.
#
# What the operator does not decide is the number. git-cliff computes it
# from the commits since the last tag, so feat/fix/revert set the bump
# and a run with nothing bump-worthy exits without releasing.
#
# WHY THIS WRITES TO main. A tag has to point at a commit carrying the
# matching version and changelog. A tag on a commit whose package.json
# says something else makes "what is this artifact" unanswerable — the
# state v1.10.0 and v1.10.1 had to be repaired out of, one of them by
# matching an installed manifest against every commit in the repo.
# Producing such a commit means writing to main, and main refuses direct
# pushes, so the release App is a bypass actor on main-protection for
# that reason and no other. Its permissions are the blast radius: keep
# them at contents:write on this repository, with no workflows scope.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Override the computed version (rarely needed; blank lets the commits decide)"
        required: false
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Deciding and doing are separate jobs so "nothing to release" is a
  # skipped job rather than a condition repeated on every step.
  #
  # It was repeated on every step but two, and the two it was missing
  # from were the commit and the tag — so a dispatch with nothing
  # bump-worthy would have written `chore(release):  [skip ci]` to main
  # with an empty version and then tried to tag it. A guard that must be
  # remembered per step is a guard that eventually is not.
  decide:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.decide.outputs.release }}
      version: ${{ steps.decide.outputs.version }}
      tag: ${{ steps.decide.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          # git-cliff walks back to the previous tag. A shallow clone
          # computes the wrong version silently rather than failing.
          fetch-depth: 0

      - name: Compute the next version
        id: bump
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --bumped-version
        env:
          OUTPUT: /tmp/next-version

      - name: Decide
        id: decide
        # Inputs arrive through env, never interpolated into the script.
        # `${{ }}` pastes the value in as source text before bash sees it,
        # so a version string containing shell metacharacters would run as
        # code. Only collaborators can dispatch this, which lowers the
        # stakes without changing the rule.
        env:
          FORCED: ${{ inputs.version }}
          COMPUTED: ${{ steps.bump.outputs.content }}
        run: |
          set -euo pipefail
          current="v$(node -p "require('./package.json').version")"
          forced="$FORCED"
          next="${forced:+v$forced}"
          next="${next:-$COMPUTED}"
          echo "current=$current  next=$next  forced=${forced:-no}"
          # An explicit version input is an instruction, not a suggestion,
          # so it skips the equality veto. That is what makes a partial
          # release recoverable: if a run wrote the commit and then failed
          # before tagging, main already carries the version and the
          # computed bump would match it, so without this the retry would
          # report "nothing to release" and refuse.
          if [ -n "$forced" ]; then
            {
              echo "release=true"
              echo "version=${next#v}"
              echo "tag=$next"
            } >> "$GITHUB_OUTPUT"
          elif [ -z "$next" ] || [ "$next" = "$current" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "Nothing bump-worthy since $current. No release."
          else
            {
              echo "release=true"
              echo "version=${next#v}"
              echo "tag=$next"
            } >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: decide
    if: needs.decide.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Both required by attest-build-provenance: the OIDC token is the
      # keyless signing identity, and attestations:write stores the
      # result. This replaces the RPM's GPG key — no key on any host to
      # store, rotate, or leak.
      id-token: write
      attestations: write
    steps:
      - name: Mint a token for the release App
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      # The same composite the gate uses: node from .nvmrc, plus an npm
      # cache keyed on the dependency set. One definition, so a release
      # builds on the toolchain the gate proved.
      - uses: ./.github/actions/setup

      - name: Regenerate the changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --tag ${{ needs.decide.outputs.tag }}
        env:
          OUTPUT: CHANGELOG.md

      - name: Write the version into the manifests
        env:
          VERSION: ${{ needs.decide.outputs.version }}
        # --allow-same-version so a retry of a partial release is not
        # refused for setting the version it already has.
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: npm ci

      - name: Gate the release commit
        # The same gate every PR runs. A release is still a commit on
        # main and does not get to skip it — and this is what makes
        # "build failures are a CD concern" true rather than
        # aspirational: a broken tree never becomes a published artifact.
        run: npm run ci

      - name: Ask the forge to write the release commit
        id: commit
        # NOT `git commit && git push`. A push sends an object already
        # built, so it arrives unsigned no matter which token carried it
        # — which is why every chore(release) commit in this
        # repository's history is unsigned. createCommitOnBranch has
        # GitHub construct the object and sign it with its own key.
        #
        # expectedHeadOid makes it a compare-and-swap: if anything landed
        # on main since this job read it, the mutation fails rather than
        # clobbering.
        #
        # This is the first write of the run. The artifact is already
        # built and attested by now, so everything that could fail
        # cheaply has.
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ needs.decide.outputs.tag }}
        run: |
          set -euo pipefail
          head=$(git rev-parse HEAD)
          # --rawfile, not --arg "$(base64 ...)". A single argv entry is
          # capped at 128 KB on Linux and package-lock.json base64s to
          # roughly 460 KB, which failed as "jq: Argument list too long"
          # on the first real release. jq reads the files itself and
          # encodes them below, so nothing large crosses the command line.
          jq -n \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg head "$head" \
            --arg msg "chore(release): $TAG [skip ci]" \
            --rawfile pkg package.json \
            --rawfile lock package-lock.json \
            --rawfile log CHANGELOG.md \
            '{query:"mutation($input:CreateCommitOnBranchInput!){createCommitOnBranch(input:$input){commit{oid}}}",
              variables:{input:{
                branch:{repositoryNameWithOwner:$repo,branchName:"main"},
                expectedHeadOid:$head,
                message:{headline:$msg},
                fileChanges:{additions:[
                  {path:"package.json",contents:($pkg|@base64)},
                  {path:"package-lock.json",contents:($lock|@base64)},
                  {path:"CHANGELOG.md",contents:($log|@base64)}]}}}}' > /tmp/mutation.json
          oid=$(gh api graphql --input /tmp/mutation.json --jq '.data.createCommitOnBranch.commit.oid')
          [ -n "$oid" ] || { echo "::error::createCommitOnBranch returned no oid"; exit 1; }
          echo "release commit: $oid"
          echo "oid=$oid" >> "$GITHUB_OUTPUT"

      - name: Check out the release commit
        # The tree at this point holds the new version and changelog as
        # uncommitted edits, and make-release refuses a dirty tree —
        # correctly, because an artifact containing changes no commit
        # records makes "what is on prod" unanswerable.
        #
        # createCommitOnBranch writes to the remote and never touches the
        # working tree, so no ordering of these steps produces a clean
        # one. Checking the release commit out does: the tree becomes
        # exactly what was committed, and the RELEASE file inside the
        # artifact then records the commit the tag will point at rather
        # than the one this job started from.
        env:
          OID: ${{ steps.commit.outputs.oid }}
        run: |
          set -euo pipefail
          git fetch --quiet origin "$OID"
          git checkout --quiet --detach "$OID"
          test -z "$(git status --porcelain)" || {
            echo "::error::tree still dirty after checking out $OID"
            git status --porcelain
            exit 1
          }
          echo "building from $OID"

      - name: Build the artifact
        # Built from the release commit, so the artifact and the tag name
        # the same tree, and RELEASE records a commit that exists.
        #
        # This does mean the commit lands before the build. The gate above
        # has already run a full `astro build` on this exact tree, so a
        # failure here is a packaging fault rather than a compile one —
        # but if it does fail, main carries the version bump with no tag
        # and no release, and `decide` will report nothing to release on
        # the next dispatch. Recovering means dispatching with the version
        # input set to the same number.
        run: npm run release

      - name: Attest the artifact
        # Binds the tarball's sha256 to this workflow, repo and commit
        # through Sigstore. A host verifies with `gh attestation verify`
        # before installing, which is the gate against a release asset
        # that did not come from here.
        uses: actions/attest-build-provenance@v4
        with:
          # One artifact, one attestation. MANIFEST.sha256 lives inside
          # the tarball, so this signature already covers it; a copy
          # published beside it would add no proof and one more thing
          # that could disagree.
          subject-path: dist-release/vigario-website-${{ needs.decide.outputs.version }}.tar.gz

      - name: Tag it
        # After the commit exists and the artifact is built and attested.
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ needs.decide.outputs.tag }}
          OID: ${{ steps.commit.outputs.oid }}
        run: |
          set -euo pipefail
          obj=$(gh api "repos/$GITHUB_REPOSITORY/git/tags" \
            -f tag="$TAG" -f message="Release $TAG" -f object="$OID" -f type=commit \
            --jq .sha)
          gh api "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$TAG" -f sha="$obj" >/dev/null
          echo "tagged $TAG -> $OID"

      - name: Publish
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ needs.decide.outputs.tag }}
          ARTIFACT: dist-release/vigario-website-${{ needs.decide.outputs.version }}.tar.gz
        run: |
          set -euo pipefail
          gh release create "$TAG" "$ARTIFACT" \
            --title "$TAG" \
            --notes "$(npx --yes git-cliff@2 --config cliff.toml --latest --strip all)"
