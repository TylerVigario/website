name: Release

env:
  HUSKY: 0
  CI: true
  # Pinned to match prod's installed Node major. See package.json
  # `engines.node` and .nvmrc — all three must declare the same
  # major; the gate's "Verify Node major pins agree" step enforces it.
  NODE_VERSION: "24"

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump (leave empty to auto-detect from commits)"
        required: false
        type: choice
        options: ["", "major", "minor", "patch"]
        default: ""

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # =========================================================================
  # Gate — every quality check that should block a release. Solo-dev +
  # main-only means there's no separate "CI on push" job; this gate is
  # the single backstop for "did I forget to lint/typecheck/build before
  # tagging."
  # =========================================================================
  gate:
    name: Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6
      - name: Verify Node major pins agree
        # NODE_VERSION env (this workflow), .nvmrc, and package.json
        # engines.node must all declare the same Node major. Drift
        # between the two would ship an artifact whose contract claims
        # one major and whose runtime built it on another.
        run: |
          NVMRC_MAJOR=$(sed -E 's/^[^0-9]*([0-9]+).*/\1/' .nvmrc)
          ENGINES_MAJOR=$(node -p "require('./package.json').engines.node.match(/\d+/)[0]")
          ENV_VERSION="${{ env.NODE_VERSION }}"
          echo "Node major check: NODE_VERSION=$ENV_VERSION  .nvmrc=$NVMRC_MAJOR  engines.node=$ENGINES_MAJOR"
          if [ "$NVMRC_MAJOR" != "$ENV_VERSION" ] || [ "$ENGINES_MAJOR" != "$ENV_VERSION" ]; then
            echo "::error::Node major mismatch — bump NODE_VERSION env (release.yml), .nvmrc, and package.json engines.node together."
            exit 1
          fi
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci --prefer-offline
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format
      - run: npm run build

  # =========================================================================
  # Release — depends on gate. Bumps version, builds the standalone tar,
  # tags + pushes, creates the GH Release with the artifact attached.
  # The artifact at this point is what prod will swap to on the
  # `release.published` webhook.
  # =========================================================================
  release:
    name: Release
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Determine next version
        id: version
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          if [ -n "${{ inputs.bump }}" ]; then
            TAG=$(git-cliff --bump ${{ inputs.bump }} --bumped-version)
          else
            TAG=$(git-cliff --bumped-version)
          fi
          BARE="${TAG#v}"
          if [ "$BARE" = "$CURRENT" ]; then
            echo "::warning::No version change detected (already at $CURRENT). Skipping release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$BARE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Next version: $TAG (current: $CURRENT)"

          # Defend against the "previous run failed mid-flight, tag was
          # pushed but workflow never finished" case. package.json's
          # CURRENT may not reflect what's actually tagged in git.
          if git rev-parse --verify "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists in git. A previous release run probably partially completed. Manually delete the tag (git push --delete origin $TAG) or bump past it before retrying."
            exit 1
          fi

      - name: Bump package.json
        if: steps.version.outputs.skip != 'true'
        run: npm version ${{ steps.version.outputs.version }} --no-git-tag-version

      - name: Build
        if: steps.version.outputs.skip != 'true'
        run: npm run build
        # No NEXT_PUBLIC_* and no build-time secrets. SQLITE_PATH is
        # runtime-only — the bundle reads it from /opt/website/.env at
        # server start, never from the build env.

      - name: Package standalone
        if: steps.version.outputs.skip != 'true'
        run: |
          # Standalone bundle is self-contained. cp -rT (treat dest as
          # a file, not a dir to nest into) so this works whether the
          # target already exists or not.
          cp -rT public .next/standalone/public
          cp -rT .next/static .next/standalone/.next/static

          # .env.example documents the runtime contract (SQLITE_PATH +
          # SMTP_*); ships in the tar so first-time deploys can copy it.
          cp .env.example .next/standalone/.env.example

          # BUILD_INFO so prod can verify Node + glibc + arch match
          # before swap. Provenance only — no secrets land here.
          jq -n \
            --arg tag "${{ steps.version.outputs.tag }}" \
            --arg commit "$(git rev-parse HEAD)" \
            --arg buildTime "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg nodeVersion "$(node --version)" \
            --arg os "$(. /etc/os-release && echo "$ID-$VERSION_ID")" \
            --arg arch "$(uname -m)" \
            --arg glibcVersion "$(ldd --version | head -1 | awk '{print $NF}')" \
            --arg assetName "tylervigario-${{ steps.version.outputs.tag }}.tar.gz" \
            '{tag: $tag, commit: $commit, buildTime: $buildTime, nodeVersion: $nodeVersion, os: $os, arch: $arch, glibcVersion: $glibcVersion, assetName: $assetName}' \
            > .next/standalone/BUILD_INFO

          # MANIFEST schemaVersion 2 contract (canonical shape from
          # vis-daily-tracker). tylervigario specifics:
          #   - cli omitted: no CLI binary shipped (deploy script
          #     skips discovery on absent .cli)
          #   - preStartCommands []: SQLite init is on-demand on first
          #     request; no migration step (deploy short-circuits on
          #     length 0)
          #   - requiredTools {}: just Node — explicit empty object
          #     signals "considered, none" rather than "forgot"
          #   - requiredEnv: SQLITE_PATH (sourced from /opt/website/.env)
          #   - optionalEnv: SMTP_* (when both USER+PASS set, route
          #     handlers send notification emails; otherwise degrade
          #     gracefully)
          NODE_MAJOR=$(node -p "require('./package.json').engines.node.match(/\d+/)[0]")
          jq -n \
            --arg tag "${{ steps.version.outputs.tag }}" \
            --arg nodeMajor "$NODE_MAJOR" \
            '{
              schemaVersion: 2,
              tag: $tag,
              startCommand: "node server.js",
              preStartCommands: [],
              port: 3000,
              healthCheckPath: "/api/health",
              requiredEnv: ["SQLITE_PATH"],
              optionalEnv: ["SMTP_HOST", "SMTP_PORT", "SMTP_USER", "SMTP_PASS"],
              nodeVersion: $nodeMajor,
              requiredTools: {}
            }' \
            > .next/standalone/MANIFEST

          tar -czf tylervigario-${{ steps.version.outputs.tag }}.tar.gz -C .next/standalone .

      - name: Compute SHA256SUMS
        if: steps.version.outputs.skip != 'true'
        run: |
          sha256sum tylervigario-${{ steps.version.outputs.tag }}.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Generate changelog
        if: steps.version.outputs.skip != 'true'
        run: |
          BUMP_ARG="${{ inputs.bump }}"
          git-cliff --bump ${BUMP_ARG:+$BUMP_ARG} --output CHANGELOG.md
          git-cliff --bump ${BUMP_ARG:+$BUMP_ARG} --unreleased --strip header --output RELEASE_NOTES.md

      - name: Commit, tag and push
        if: steps.version.outputs.skip != 'true'
        run: |
          git add package.json package-lock.json CHANGELOG.md
          git commit -m "chore(release): ${{ steps.version.outputs.tag }}"
          git tag ${{ steps.version.outputs.tag }}
          git push origin main --follow-tags

      # Two-step publish: create as draft with all assets attached,
      # then flip to published. Guarantees the `release.published`
      # webhook only fires once both files are uploaded — prevents the
      # race where prod fetches before SHA256SUMS lands.
      - name: Create GitHub Release (draft)
        if: steps.version.outputs.skip != 'true'
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body_path: RELEASE_NOTES.md
          draft: true
          files: |
            tylervigario-${{ steps.version.outputs.tag }}.tar.gz
            SHA256SUMS

      - name: Publish Release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit ${{ steps.version.outputs.tag }} --draft=false

      - name: Generate job summary
        if: always()
        run: |
          VERSION=${{ steps.version.outputs.version }}
          TAG=${{ steps.version.outputs.tag }}
          SKIP=${{ steps.version.outputs.skip }}
          echo "## Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "$SKIP" = "true" ]; then
            echo "> **Skipped** — no version change detected (already at v${VERSION})" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| **Version** | v${VERSION} |" >> $GITHUB_STEP_SUMMARY
            echo "| **Tag** | \`${TAG}\` |" >> $GITHUB_STEP_SUMMARY
            echo "| **Bump** | ${{ inputs.bump || 'auto-detected' }} |" >> $GITHUB_STEP_SUMMARY
          fi
