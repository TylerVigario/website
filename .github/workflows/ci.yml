name: CI

env:
  HUSKY: 0
  CI: true

on:
  push:
    branches: [main]
  pull_request:

# Concurrency: PRs cancel prior runs of the same PR (saves CI time on
# rapid pushes), main pushes queue serially. Nothing releases from here
# yet — the RPM pipeline was retired and the replacement is not built.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only. No job here writes anything.
permissions:
  contents: read

jobs:
  # =========================================================================
  # Gate — quality checks + full-build validation. Runs on every PR and
  # every push to main. It is currently the whole of CI: the RPM release
  # job was retired with the packaging tree, and no replacement release
  # shape exists yet.
  # =========================================================================
  gate:
    name: Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6
      - name: Verify Node major pins agree
        # .nvmrc and package.json#engines.node must declare the same
        # Node major. CI reads .nvmrc directly (node-version-file in the
        # setup composite + the release job), so there's no separate
        # workflow pin. These were two of four pins once; the RPM spec
        # and systemd unit held the others and went with the packaging
        # tree, so this check is now the whole of it.
        run: |
          NVMRC_MAJOR=$(sed -E 's/^[^0-9]*([0-9]+).*/\1/' .nvmrc)
          ENGINES_MAJOR=$(jq -r '.engines.node' package.json | grep -oE '[0-9]+' | head -1)
          echo "Node major check: .nvmrc=$NVMRC_MAJOR  engines.node=$ENGINES_MAJOR"
          if [ "$NVMRC_MAJOR" != "$ENGINES_MAJOR" ]; then
            echo "::error::Node major mismatch — bump .nvmrc and package.json engines.node together."
            exit 1
          fi
      - name: Run actionlint
        # Lints workflow YAML (bad ${{ }} expressions, deprecated action
        # refs, shell-syntax errors in run: blocks) before the heavier
        # steps — needs no node_modules, so failing here is cheap. Pin
        # BOTH the installer-script tag (not `main`, which is mutable)
        # AND the binary version so neither floats.
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color
      # Node setup + npm cache + `npm ci`, factored into a composite so
      # the release job (and future jobs) reuse the same block. Reads
      # the Node version from .nvmrc.
      - uses: ./.github/actions/setup
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format
      - run: npm test
      - name: Cache Astro build
        # Astro's content and build caches live under .astro/. A warm
        # cache shaves wall-clock; the key rotates when deps or source
        # change, and restore-keys let a stale cache still seed it.
        uses: actions/cache@v5
        with:
          path: .astro
          key: astro-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'astro.config.mjs') }}
          restore-keys: |
            astro-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            astro-${{ runner.os }}-
      - name: Validate build
        # `astro build` prerenders every page and compiles the server
        # entry. No secrets are needed: the build reads no credentials,
        # and the two runtime env vars (SQLITE_PATH, SMTP_*) are only
        # read when the server actually starts.
        run: npm run build

      - name: The site ships no framework runtime
        # Identical logic to `npm run check:bundles`, because it IS that
        # script. It previously lived inline here and nowhere else, so it
        # could only fail after a push — and a stale shell fragment left
        # below the heredoc meant it would have failed unconditionally
        # under `set -u` the first time it ran.
        run: npm run check:bundles
