name: CI

env:
  HUSKY: 0
  CI: true

on:
  push:
    branches: [main]
  pull_request:
  # release.yml calls this workflow as its gate, so a release is checked
  # by exactly what every pull request is checked by, on the commit being
  # released. A copy of the steps there would drift from these.
  workflow_call:

# Concurrency: PRs cancel prior runs of the same PR (saves CI time on
# rapid pushes), main pushes queue serially. Nothing releases from here —
# releasing is release.yml, on workflow_dispatch, because merging says
# the code is good and releasing says ship it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only. No job here writes anything.
permissions:
  contents: read

jobs:
  # =========================================================================
  # One job per check, on every PR, every push to main, and in every
  # release once its version is decided. Each job is its own required
  # context in .github/rulesets/main.json, so a red check names what
  # failed, and removing a check means removing its context there, which
  # is a protection change, reviewed as one. tests/required-checks.test.ts
  # holds the two lists to each other.
  #
  # Jobs share nothing. Each checks out and installs for itself, and a
  # check that needs the build runs the build, so no result rests on
  # another job having run. The repeated installs cost minutes, which a
  # public repository is not billed for.
  #
  # Every checkout drops its token (persist-credentials: false). Nothing
  # here talks to the remote after checkout, so the token has no reason
  # to sit in .git/config while npm ci, the tests and the build run
  # whatever the dependency tree contains.
  # =========================================================================
  pins:
    name: Node pins agree
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify Node major pins agree
        # .nvmrc and package.json#engines.node must declare the same
        # Node major. CI reads .nvmrc directly (node-version-file, in the
        # setup composite and in commit-convention.yml), so there's no
        # separate workflow pin.
        #
        # It is a script rather than inline bash so the pre-push hook runs
        # the identical comparison. Inline, the check existed only on the
        # far side of a push.
        run: node scripts/check-node-pins.ts

  install-scripts:
    name: Install scripts reviewed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Node setup + npm cache + `npm ci`, factored into a composite so
      # every job here and the release build install the same way. Reads
      # the Node version from .nvmrc.
      - uses: ./.github/actions/setup
      - name: Every install script is reviewed
        # A dependency that brought a new install script in, or moved past
        # its pinned approval, is named here. See
        # scripts/check-install-scripts.ts.
        run: npm run check:install-scripts

  typecheck:
    name: Types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: npm run typecheck

  eslint:
    name: ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: npm run lint:js

  markdown:
    name: Markdown
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: npm run lint:md

  workflows:
    name: Workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # actionlint is a devDependency (@kjanat/actionlint), so the install
      # brings the version every clone runs, and the runner's shellcheck
      # checks the shell in each run: block.
      - uses: ./.github/actions/setup
      - run: npm run lint:actions

  format:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: npm run format

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Validate build
        # `astro build` prerenders every page and compiles the server
        # entry. No secrets are needed: the build reads no credentials,
        # and the server's settings (SQLITE_PATH, the mail settings and
        # the rest .env.example lists) are only read when it runs.
        run: npm run build

  bundles:
    name: Page budgets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: npm run build
      - name: Page budgets, inline code, titles and unused images
        # The same script as `npm run check:bundles`, so it fails locally
        # first: each prerendered page's JavaScript against its budget, no
        # inline code, a title and description of its own, and no image
        # shipped that nothing uses.
        run: npm run check:bundles

  forms:
    name: Forms without JavaScript
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: npm run build
      - name: The forms work without JavaScript
        # The built server on a scratch database, posted to the way a
        # browser behind the proxy posts: both pages, the API, the origin
        # check, the body limit, and what ends up stored. The same script
        # as `npm run check:forms`, so it fails locally first.
        run: npm run check:forms

  release-artifact:
    name: Release artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: The release artifact runs
        # The tarball a release would publish, built from this
        # commit, unpacked, checked against its manifest and booted from
        # its own node_modules with the forms posted to it. Release runs
        # the same check on the real artifact; here it catches a packaging
        # mistake on the pull request that makes it, rather than on the
        # day of a release. Not in pre-push: the artifact carries the
        # linux-x64 binary only, and installs its runtime from the
        # registry.
        run: |
          set -euo pipefail
          npm run release -- --out "$RUNNER_TEMP/release"
          version=$(node -p "require('./package.json').version")
          npm run check:release -- "$RUNNER_TEMP/release/vigario-website-$version.tar.gz"

  dev-server:
    name: Dev server
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: The dev server boots
        # Every other job tests the BUILT output. Nothing tested the
        # thing developers actually run, which is how `ssr.noExternal:
        # true` left `astro dev` dead for weeks with every check green —
        # rolldown does the CJS interop at build time that Vite's dev
        # module runner does not, so the two paths genuinely disagree and
        # only one of them was watched.
        #
        # ASTRO_DEV_BACKGROUND=1 keeps the server in this process rather
        # than detaching a child and returning. Nothing is torn down: the
        # runner is discarded either way, and a kill racing the fetch
        # would buy flakiness for nothing.
        env:
          ASTRO_DEV_BACKGROUND: "1"
        run: |
          set -euo pipefail
          # --host 127.0.0.1 is required, not tidiness. Left to itself the
          # dev server binds "localhost", which on the runner resolves to
          # ::1 first — the server comes up healthy and every curl to
          # 127.0.0.1 is refused. Binding the address explicitly makes the
          # two agree.
          npx astro dev --host 127.0.0.1 --port 4327 > /tmp/dev.log 2>&1 &
          if ! curl -sSf --retry-connrefused --retry 60 --retry-delay 1 \
                 --retry-max-time 120 --max-time 20 \
                 -o /tmp/dev-page.html http://127.0.0.1:4327/; then
            echo "::error::the dev server did not serve a page"
            tail -30 /tmp/dev.log
            exit 1
          fi
          grep -q "</html>" /tmp/dev-page.html
          echo "dev server served $(wc -c < /tmp/dev-page.html) bytes"
