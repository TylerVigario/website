name: CI

env:
  HUSKY: 0
  CI: true

on:
  push:
    branches: [main]
  pull_request:

# Concurrency: PRs cancel prior runs of the same PR (saves CI time on
# rapid pushes), main pushes queue serially. Nothing releases from here —
# releasing is release.yml, on workflow_dispatch, because merging says
# the code is good and releasing says ship it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only. No job here writes anything.
permissions:
  contents: read

jobs:
  # =========================================================================
  # Gate — quality checks + full-build validation. Runs on every PR and
  # every push to main. This is the whole of continuous integration;
  # release.yml is separate and runs only when asked.
  # =========================================================================
  gate:
    name: Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
      - name: Verify Node major pins agree
        # .nvmrc and package.json#engines.node must declare the same
        # Node major. CI reads .nvmrc directly (node-version-file in the
        # setup composite + the release job), so there's no separate
        # workflow pin. These were two of four pins once; the other two
        # belonged to the packaging tree and went with it, so this check
        # is now the whole of it.
        #
        # It is a script rather than inline bash so the pre-push hook runs
        # the identical comparison. Inline, the check existed only on the
        # far side of a push.
        run: node scripts/check-node-pins.mjs
      - name: Run actionlint
        # Lints workflow YAML (bad ${{ }} expressions, deprecated action
        # refs, shell-syntax errors in run: blocks) before the heavier
        # steps — needs no node_modules, so failing here is cheap. Pin
        # BOTH the installer-script tag (not `main`, which is mutable)
        # AND the binary version so neither floats.
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color
      # Node setup + npm cache + `npm ci`, factored into a composite so
      # the release job (and future jobs) reuse the same block. Reads
      # the Node version from .nvmrc.
      - uses: ./.github/actions/setup
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format
      - run: npm test
      - name: Cache Astro build
        # Astro's content and build caches live under .astro/. A warm
        # cache shaves wall-clock; the key rotates when deps or source
        # change, and restore-keys let a stale cache still seed it.
        uses: actions/cache@v6
        with:
          path: .astro
          key: astro-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'astro.config.mjs') }}
          restore-keys: |
            astro-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            astro-${{ runner.os }}-
      - name: Validate build
        # `astro build` prerenders every page and compiles the server
        # entry. No secrets are needed: the build reads no credentials,
        # and the two runtime env vars (SQLITE_PATH, SMTP_*) are only
        # read when the server actually starts.
        run: npm run build

      - name: The site ships no framework runtime
        # Identical logic to `npm run check:bundles`, because it IS that
        # script. It previously lived inline here and nowhere else, so it
        # could only fail after a push — and a stale shell fragment left
        # below the heredoc meant it would have failed unconditionally
        # under `set -u` the first time it ran.
        run: npm run check:bundles

      - name: The dev server boots
        # Everything above tests the BUILT output. Nothing tested the
        # thing developers actually run, which is how `ssr.noExternal:
        # true` left `astro dev` dead for weeks with every check green —
        # rolldown does the CJS interop at build time that Vite's dev
        # module runner does not, so the two paths genuinely disagree and
        # only one of them was watched.
        #
        # ASTRO_DEV_BACKGROUND=1 keeps the server in this process rather
        # than detaching a child and returning. Nothing is torn down: the
        # runner is discarded either way, and a kill racing the fetch
        # would buy flakiness for nothing.
        env:
          ASTRO_DEV_BACKGROUND: "1"
        run: |
          set -euo pipefail
          # --host 127.0.0.1 is required, not tidiness. Left to itself the
          # dev server binds "localhost", which on the runner resolves to
          # ::1 first — the server comes up healthy and every curl to
          # 127.0.0.1 is refused. Binding the address explicitly makes the
          # two agree.
          npx astro dev --host 127.0.0.1 --port 4327 > /tmp/dev.log 2>&1 &
          if ! curl -sSf --retry-connrefused --retry 60 --retry-delay 1 \
                 --retry-max-time 120 --max-time 20 \
                 -o /tmp/dev-page.html http://127.0.0.1:4327/; then
            echo "::error::the dev server did not serve a page"
            tail -30 /tmp/dev.log
            exit 1
          fi
          grep -q "</html>" /tmp/dev-page.html
          echo "dev server served $(wc -c < /tmp/dev-page.html) bytes"
