[changelog]
header = "# Changelog\n"
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}](https://github.com/TylerVigario/website/{% if previous.version %}compare/{{ previous.version }}...{{ version }}{% else %}releases/tag/{{ version }}{% endif %}) ({{ timestamp | date(format="%Y-%m-%d") }})

{% else %}\
## [Unreleased]

{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}\
### {{ group | striptags | trim }}

{% for commit in commits %}\
* {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{% if commit.breaking %}[**breaking**] {% endif %}{{ commit.message | upper_first }}
{% endfor %}
{% endfor %}\
"""
trim = true
render_always = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = false
filter_commits = true
topo_order = false
sort_commits = "oldest"
tag_pattern = "v[0-9].*"
commit_preprocessors = [
  { pattern = '\(#\d+\)', replace = "" },
]
# Angular Conventional Commits. Only `feat` and `fix` (and `revert`,
# which from the user's perspective ships a behavior change) appear
# in the changelog AND drive version bumps. Every other type is
# skipped — no bump, no changelog entry. Per the CC spec, a `refactor`
# that actually shipped user-visible work was mis-typed and should
# have been `feat` / `fix`.
#
# `style` is parsed (skip) only to keep historical-commit regeneration
# faithful. New commits should use `chore` for formatting — commitlint
# doesn't list `style` in its type-enum.
#
# See .commitlintrc.js for the matching type-enum + rationale.
commit_parsers = [
  { message = "^feat",     group = "<!-- 0 -->Features" },
  { message = "^fix",      group = "<!-- 1 -->Bug Fixes" },
  { message = "^revert",   group = "<!-- 1 -->Bug Fixes" },
  { message = "^refactor", skip = true },
  { message = "^perf",     skip = true },
  { message = "^style",    skip = true },
  { message = "^ci",       skip = true },
  { message = "^build",    skip = true },
  { message = "^docs",     skip = true },
  { message = "^test",     skip = true },
  { message = "^chore",    skip = true },
]

[bump]
features_always_bump_minor = true
breaking_always_bump_major = true
initial_tag = "v1.0.0"
